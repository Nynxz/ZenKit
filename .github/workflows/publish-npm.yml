name: publish-npm

# The four published packages. Manual: a version bump is a decision.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and inspect, publish nothing
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm >= 11.5.1 for OIDC. setup-node ships whatever the Node line bundles, so pin it.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # No NODE_AUTH_TOKEN: each package is bootstrapped by hand once, then given a trusted
      # publisher on npmjs.com, so CI authenticates purely by OIDC. A token fallback would also
      # mask a missing trusted-publisher config — this way that fails loudly instead.
      #
      # pnpm packs, npm publishes. pnpm rewrites `workspace:*` to real versions in the tarball
      # (npm would ship them verbatim and publish something nobody can install), but pnpm has no
      # OIDC support — trusted publishing lives in the npm CLI. So each half does what only it can.
      #
      # Order matters: zenkit-types before zenkit-client, which depends on it.
      - name: Pack
        run: |
          mkdir -p dist-tarballs
          for p in types ui nodekit client; do
            (cd "packages/$p" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs")
          done
          ls -la dist-tarballs

      - name: Publish
        run: |
          for p in types ui nodekit client; do
            tgz=$(ls dist-tarballs/nynxz-zenkit-$p-*.tgz)
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              npm publish "$tgz" --access public --dry-run
            else
              npm publish "$tgz" --access public
            fi
          done
