name: publish-registry

# Build a plugin and publish it to the ComfyUI registry. The bundle is gitignored and picked
# up via `[tool.comfy] includes = ["js"]`.
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Which plugin to publish
        type: choice
        options: [all, ComfyUI-ZenKit, ComfyUI-ZenSuite, ComfyUI-ZenInspector]
        default: all

jobs:
  # The matrix follows the input, so publishing one plugin runs one job rather than three
  # with two of them building bundles nobody uses.
  select:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.pick.outputs.plugins }}
    steps:
      - id: pick
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          if [ "$PLUGIN" = all ]; then
            echo 'plugins=["ComfyUI-ZenKit","ComfyUI-ZenSuite","ComfyUI-ZenInspector"]' >> "$GITHUB_OUTPUT"
          else
            echo "plugins=[\"$PLUGIN\"]" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      # One plugin's failure should not cancel the others' publishes.
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.select.outputs.plugins) }}
    env:
      PLUGIN: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pnpm install --frozen-lockfile

      # This plugin and the workspace packages it depends on, nothing else.
      - name: Build
        run: |
          pkg=$(node -p "require('./plugins/$PLUGIN/package.json').name")
          pnpm --filter "$pkg..." build

      - name: Fail if this plugin produced no bundle
        run: test -f "plugins/$PLUGIN/js/main.js"

      # comfy-cli archives git-TRACKED files only, and js/ is gitignored. Staging is enough —
      # `git ls-files` lists the index, so nothing is committed or pushed.
      - name: Stage the built bundle so the archive includes it
        run: git add -f "plugins/$PLUGIN/js"

      - run: pip install comfy-cli

      - name: Publish to the ComfyUI registry
        working-directory: plugins/${{ matrix.plugin }}
        run: comfy node publish --token "$REGISTRY_TOKEN"
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
