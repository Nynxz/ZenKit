[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-zenkit"
version = "0.2.0"
description = "ZenKit — a UX framework for ComfyUI: panels, a theme token system, and a cross-plugin event bus, exposed as window.ZenKit."
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/Nynxz/ZenKit"

[tool.comfy]
PublisherId = "nynxz"
DisplayName = "ComfyUI-ZenKit"
# The built frontend must ship in the registry package. It is gitignored, so CI
# builds and stages it — see .github/workflows/publish-registry.yml.
includes = ["js"]

[tool.setuptools.package-data]
"*" = ["*.*"]

# Plugin identity the Zen Inspector reads back to name this pack; matches the
# `id` passed to registerZenPlugin on the frontend.
[tool.zenkit]
id = "zenkit"
