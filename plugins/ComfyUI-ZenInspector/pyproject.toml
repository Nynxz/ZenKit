[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-zeninspector"
version = "0.2.0"
description = "Zen Inspector — install-wide ComfyUI debug panel: every nodepack and frontend extension, what each actually registered, and where the sources disagree. Requires ComfyUI-ZenKit."
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/Nynxz/ZenKit/tree/main/plugins/ComfyUI-ZenInspector"

[tool.comfy]
PublisherId = "nynxz"
DisplayName = "ComfyUI-ZenInspector"
# The built frontend must ship in the registry package. It is gitignored, so CI
# builds and stages it — see .github/workflows/publish-registry.yml.
includes = ["js"]

# The single source of plugin identity (read natively by the Python ZenPlugin helper and at
# build time by the JS side). `id` derives the namespace + the `<id>:` panel-id prefix.
[tool.zenkit]
id = "zeninspector"

[tool.setuptools.package-data]
"*" = ["*.*"]
