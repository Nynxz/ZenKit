[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-zenagent"
version = "0.1.0"
description = "Zen Agent — the ComfyUI agent panel as a ZenKit panel, backed by a local OpenAI-compatible model (LM Studio, Ollama, …). Requires ComfyUI-ZenKit and a frontend built with the standalone agent panel."
license = { text = "MIT" }

[tool.comfy]
PublisherId = "nynxz"
DisplayName = "ComfyUI-ZenAgent"
includes = ["js"]

[tool.zenkit]
id = "zenagent"

[tool.setuptools.package-data]
"*" = ["*.*"]
